<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d20"><title>NEON DODGE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d20;color:white;font-family:system-ui;display:flex;justify-content:center;min-height:100vh}#game{width:min(100%,440px);padding:14px;display:flex;flex-direction:column;gap:11px}header,.stats{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.brand{font-weight:900;letter-spacing:3px;color:#65efff}.muted{color:#aab8d6;font-size:12px}canvas{width:100%;height:auto;aspect-ratio:360/520;border-radius:14px;border:1px solid #293b68;display:block;touch-action:none}.stage{position:relative}.controls{display:flex;gap:12px}.controls button,#overlay button{border:1px solid #41558b;border-radius:12px;background:#172348;color:#b9f8ff;padding:13px;font-size:19px;font-weight:800}.controls button{flex:1;touch-action:none}#overlay{position:absolute;inset:0;background:#080d20ed;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;border-radius:14px;padding:18px;overflow:auto}#overlay h2{margin:0;color:#65efff;letter-spacing:2px}#overlay input{width:100%;max-width:250px;padding:12px;border-radius:10px;border:1px solid #40578b;background:#101a36;color:white;font-size:16px;text-align:center}#overlay button{font-size:15px;padding:12px 22px}#scores{width:100%;max-width:280px;text-align:left;background:#101a36;border:1px solid #293b68;border-radius:10px;padding:9px;font-size:12px}.score-row{display:flex;justify-content:space-between;padding:3px 0;color:#dce7ff}
</style></head><body><main id="game">
<header><span class="brand">✦ NEON DODGE</span><span>BEST <b id="best">0</b></span></header>
<div class="stats"><span>PEMAIN <b id="playerLabel" style="color:#65efff">Pemain</b></span><span>SKOR <b id="score" style="color:#65efff">0</b></span><span>KOIN <b id="coins" style="color:#ffd84c">0</b></span></div>
<div class="stage"><canvas id="board" width="360" height="520"></canvas><div id="overlay"><div style="font-size:42px">🚀</div><h2>NEON DODGE</h2><p class="muted">Masukkan nama, hindari meteor, kumpulkan koin!</p><input id="playerName" maxlength="14" placeholder="Nama pemain" autocomplete="nickname"><button id="start">▶ MULAI MAIN</button><div id="scores"><b style="color:#65efff">🏆 LEADERBOARD PERANGKAT INI</b><div id="scoreList" class="muted">Belum ada skor. Jadilah yang pertama!</div></div><p class="muted">Geser pesawat atau tahan tombol kiri/kanan.</p></div></div>
<div class="controls"><button id="left">◀</button><button id="right">▶</button></div><p class="muted" style="text-align:center;margin:0">Ambil koin emas. Hindari meteor merah. Pecahkan rekor!</p>
</main><script>
(()=>{const c=document.getElementById('board'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let p={x:180,y:455},obs=[],score=0,coins=0,alive=false,frame=0,last=0,raf=0,dir=0,drag=false,name='Pemain',best=0;const KEY='neondodge_scores_v2';
function rows(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}function safe(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function render(){let a=rows();$('scoreList').innerHTML=a.length?a.map((r,i)=>'<div class="score-row"><span>'+(i+1)+'. '+safe(r.name)+'</span><b>'+r.score+'</b></div>').join(''):'Belum ada skor. Jadilah yang pertama!';best=a.length?a[0].score:0;$('best').textContent=best}function save(){let a=rows();a.push({name,score,coins});a.sort((x,y)=>y.score-x.score);try{localStorage.setItem(KEY,JSON.stringify(a.slice(0,10)))}catch(e){}}
render();function reset(){p.x=180;obs=[];score=0;coins=0;frame=0;dir=0;$('score').textContent=0;$('coins').textContent=0}function spawn(){let coin=Math.random()<.24;obs.push({x:18+Math.random()*324,y:-20,r:coin?9:13,coin,spd:2.4+Math.min(score/140,5)+Math.random()*1.5})}
function end(){alive=false;cancelAnimationFrame(raf);save();render();$('overlay').style.display='flex';$('overlay').innerHTML='<div style="font-size:42px">💥</div><h2 style="color:#ff9cac">GAME OVER</h2><div>'+safe(name)+' · Skor '+score+' · Koin '+coins+'</div><div id="scores"><b style="color:#65efff">🏆 TOP 10 PERANGKAT INI</b><div id="scoreList">'+rows().map((r,i)=>'<div class="score-row"><span>'+(i+1)+'. '+safe(r.name)+'</span><b>'+r.score+'</b></div>').join('')+'</div></div><button id="again">↻ MAIN LAGI</button><p class="muted">Skor tersimpan di browser/perangkat ini.</p>';$('again').onclick=()=>{location.reload()}}
function draw(){ctx.clearRect(0,0,360,520);let g=ctx.createLinearGradient(0,0,0,520);g.addColorStop(0,'#101938');g.addColorStop(1,'#090d20');ctx.fillStyle=g;ctx.fillRect(0,0,360,520);for(let i=0;i<45;i++){let x=i*83%360,y=(i*137+frame*.35)%520;ctx.fillStyle='#9ac9ff';ctx.globalAlpha=.25+(i%3)*.2;ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;obs.forEach(o=>{ctx.shadowColor=o.coin?'#ffd84c':'#ff385d';ctx.shadowBlur=14;ctx.fillStyle=o.coin?'#ffd84c':'#ff496b';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.shadowBlur=0;if(o.coin){ctx.fillStyle='#714600';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('$',o.x,o.y+4)}});ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor='#39eaff';ctx.shadowBlur=20;ctx.fillStyle='#54eaff';ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(16,15);ctx.lineTo(0,9);ctx.lineTo(-16,15);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(-3,-3,6,10);ctx.restore()}
function loop(t){if(!alive)return;let dt=Math.min((t-last)/16.67,2);last=t;frame+=dt;score+=Math.floor(dt);if(frame%Math.max(18,43-Math.floor(score/100))<dt)spawn();p.x=Math.max(18,Math.min(342,p.x+dir*5.2*dt));for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=o.spd*dt;if(Math.hypot(o.x-p.x,o.y-p.y)<o.r+12){if(o.coin){coins++;score+=25;obs.splice(i,1);$('coins').textContent=coins}else{end();return}}else if(o.y>540)obs.splice(i,1)}$('score').textContent=score;draw();raf=requestAnimationFrame(loop)}
function start(){name=($('playerName')?.value||'Pemain').trim().slice(0,14)||'Pemain';$('playerLabel').textContent=name;reset();alive=true;$('overlay').style.display='none';last=performance.now();raf=requestAnimationFrame(loop)}$('start').onclick=start;
function hold(id,d){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();dir=d;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{if(dir===d)dir=0}))}hold('left',-1);hold('right',1);c.addEventListener('pointerdown',e=>{drag=true;move(e)});c.addEventListener('pointermove',e=>{if(drag)move(e)});function move(e){let r=c.getBoundingClientRect();p.x=Math.max(18,Math.min(342,(e.clientX-r.left)/r.width*360))}['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,()=>drag=false));draw()})();
</script></body></html>
